<style>
:root{--bg:#0d1b17;--panel:#163028;--panel2:#1f4237;--line:#2c5a4b;--txt:#eefaf4;--sub:#8fc4ae;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;overscroll-behavior:none}
button{font-family:inherit;border:none;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
#app{max-width:520px;margin:0 auto;padding:18px 14px 40px;min-height:100%}
.logo{text-align:center;font-size:28px;font-weight:900;margin:8px 0 2px}
.logo .g{color:var(--green)}
.tag{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--sub);margin-bottom:10px;font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:20px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:900;line-height:1.5}
.mbtn small{display:block;font-weight:600;color:var(--sub);font-size:11px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;background:var(--panel2);color:var(--txt);font-size:14px;font-weight:800;border:2px solid transparent;flex:0 1 auto}
.chip.sel{border-color:var(--green);background:#2a5c47;color:#c8ffe6}
.bigBtn{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#3ecf8e,#1f9e68);color:#04150c;font-size:18px;font-weight:900;margin-top:10px}
.bigBtn.red{background:linear-gradient(135deg,#ff5d73,#d63a55);color:#fff}
.bigBtn.gold{background:linear-gradient(135deg,#ffc94d,#ff9f43);color:#1c1200}
.bigBtn.blue{background:linear-gradient(135deg,#4dabff,#3a7ce0);color:#fff}

.center{text-align:center}
.sub{color:var(--sub);font-size:13px;line-height:1.7}
.big{font-size:20px;font-weight:900;line-height:1.5}
.huge{font-size:44px;font-weight:900;text-align:center;line-height:1.25;word-break:keep-all}
.mini{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
.nameIn{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px;margin-bottom:8px}
/* 이마퀴즈 전체화면 */
.fsWrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column}
.fsTop{flex:1;display:flex;align-items:center;justify-content:center;background:#123d2b;flex-direction:column;gap:8px;padding:16px}
.fsBottom{height:26vh;display:flex;align-items:center;justify-content:center;background:#3d1220;color:#ffb3c0;font-size:18px;font-weight:900}
.fsTop .lbl{color:#9fe8c6;font-size:15px;font-weight:800}
.fsWord{font-size:52px;font-weight:900;text-align:center;line-height:1.2;word-break:keep-all;padding:0 10px}
.fsHud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:900;z-index:51}
.flash-ok{animation:fok .35s}
.flash-pass{animation:fps .35s}
@keyframes fok{0%{background:#3ecf8e}100%{background:#123d2b}}
@keyframes fps{0%{background:#ff5d73}100%{background:#3d1220}}
/* 폭탄 */
.bombWrap{padding:30px 0;text-align:center}
.bomb{font-size:110px;animation:sway 1s infinite ease-in-out}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.boomBG{position:fixed;inset:0;background:#c81e35;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.boomBG .b1{font-size:90px}.boomBG .b2{font-size:30px;font-weight:900;color:#fff}

#wheelBox{position:relative;width:300px;height:300px;margin:14px auto}
#wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.65,.09,1)}
.wArrow{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}
.rollBig{font-size:26px;font-weight:900;text-align:center;padding:20px 8px;background:var(--panel2);border-radius:16px;margin-top:12px;line-height:1.4;word-break:keep-all}
.tbl{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0}
.tbl td{padding:8px 4px;border-bottom:1px solid #24503f}
.tbl td:last-child{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}

.scoreRow{display:flex;justify-content:center;gap:18px;font-size:16px;font-weight:800;margin-top:8px}

function beep(freq,dur,type,vol){
  const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||'square';o.frequency.value=freq;
  g.gain.value=vol||0.15;
  o.connect(g);g.connect(c.destination);
  o.start();g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
  o.stop(c.currentTime+dur);
}
function boomSound(){
  const c=ac();if(!c)return;
  const N=c.sampleRate*0.6,buf=c.createBuffer(1,N,c.sampleRate),d=buf.getChannelData(0);

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choseong(str){
  let out='';
  for(const ch of str){
    const code=ch.charCodeAt(0);
    if(code>=0xAC00&&code<=0xD7A3)out+=CHO[Math.floor((code-0xAC00)/588)];
    else if(ch===' ')out+=' ';        // 띄어쓰기는 힌트로 유지
    else out+='·';                    // 숫자·영문은 가려서 정답 유출 방지
  }
  return out;
}

    ${[60,90,120].map(s=>`<button class="chip ${QZ.sec===s?'sel':''}" onclick="QZ.sec=${s};quizSetupRender()">${s}초</button>`).join('')}

  ${isHead
    ?'출제자가 폰을 <b>이마에 대고</b>(화면이 친구들 쪽!) 친구들이 말로 힌트 → 출제자가 정답 외치기!<br>맞히면 <b>화면 위쪽 탭</b>, 어려우면 <b>아래쪽(빨간 부분) 탭</b>해서 패스.'

  <br>팀을 나눠 점수 대결하면 더 재밌어요! (예: 3대3)</div></div>
  <button class="bigBtn" onclick="quizGo()">시작! (3초 준비)</button>
  <button class="ghostBtn" onclick="home()">← 메뉴로</button>`;

let qzTimer=null, qzNextT=null, qzOver=false;
function quizGo(){
  ac(); // 사용자 제스처로 오디오 잠금 해제
  if(qzTimer){clearInterval(qzTimer);qzTimer=null;}
  if(qzNextT){clearTimeout(qzNextT);qzNextT=null;}
  qzOver=false;
  QZ.words=shuffle(WORDS[QZ.cat]);
  QZ.idx=0;QZ.score=0;QZ.left=QZ.sec;QZ.log=[];
  let cd=3;
  const paint=()=>{app.innerHTML=`<div class="fsWrap"><div class="fsTop"><div class="huge">${cd>0?cd:'시작!'}</div>
    <div class="lbl">${QZ.kind==='head'?'폰을 이마로!':'설명 준비!'}</div></div></div>`;};
  paint();beep(600,.1);
  const iv=setInterval(()=>{cd--;paint();
    if(cd<=0){clearInterval(iv);beep(1000,.25);quizRound();}
    else beep(600,.1);
  },900);
}
function quizRound(){
  if(qzOver||QZ.left<=0)return; // 종료 후 유령 라운드 방지
  if(QZ.idx>=QZ.words.length)QZ.words=QZ.words.concat(shuffle(WORDS[QZ.cat]));
  const w=QZ.words[QZ.idx];
  app.innerHTML=`
  <div class="fsHud"><span>⏱ <span id="qLeft">${QZ.left}</span></span><span>✅ ${QZ.score}</span></div>
  <div class="fsWrap">
    <div class="fsTop" id="okZone"><div class="lbl">맞히면 여기(위쪽) 탭!</div><div class="fsWord">${esc(w)}</div></div>
    <div class="fsBottom" id="passZone">어려우면 여기 탭 (패스)</div>
  </div>`;
  $('okZone').onclick=()=>{QZ.score++;QZ.log.push([w,true]);beep(1200,.12);vib(30);QZ.idx++;quizNext('ok');};
  $('passZone').onclick=()=>{QZ.log.push([w,false]);beep(300,.15);vib([20,40,20]);QZ.idx++;quizNext('pass');};
  if(!qzTimer){
    qzTimer=setInterval(()=>{
      QZ.left--;
      const el=$('qLeft');if(el)el.textContent=QZ.left;
      if(QZ.left<=5&&QZ.left>0)beep(800,.08);
      if(QZ.left<=0){clearInterval(qzTimer);qzTimer=null;quizEnd();}
    },1000);
  }
}
function quizNext(kind){
  if(qzOver)return;
  const top=document.querySelector('.fsTop');
  if(top)top.classList.add(kind==='ok'?'flash-ok':'flash-pass');
  if(qzNextT)clearTimeout(qzNextT);
  qzNextT=setTimeout(()=>{qzNextT=null;quizRound();},120);
}
function quizEnd(){
  qzOver=true;
  if(qzTimer){clearInterval(qzTimer);qzTimer=null;}
  if(qzNextT){clearTimeout(qzNextT);qzNextT=null;}
  boomlessEnd();
}
function boomlessEnd(){
  beep(500,.2);setTimeout(()=>beep(400,.2),200);setTimeout(()=>beep(300,.4),400);
  vib([80,60,80]);
  app.innerHTML=`
  <div class="logo">⏰ 종료!</div>
  <div class="card center"><div class="huge" style="color:var(--gold)">${QZ.score}점</div>
  <div class="sub">주제: ${QZ.cat} · ${QZ.sec}초</div></div>
  <div class="card"><h3>기록</h3><table class="tbl">
    ${QZ.log.map(([w,ok])=>'<tr><td>'+esc(w)+'</td><td>'+(ok?'✅':'❌ 패스')+'</td></tr>').join('')||'<tr><td>기록 없음</td></tr>'}
  </table></div>
  <button class="bigBtn" onclick="quizGo()">🔄 같은 설정으로 다음 사람!</button>
  <button class="ghostBtn" onclick="quizSetupRender()">설정 바꾸기</button>
  <button class="ghostBtn" onclick="home()">← 메뉴로</button>`;
}

/* =====================================================
   🎯 벌칙 룰렛
===================================================== */
let PEN=PENALTY_DEFAULT.slice();
let wheelAngle=0;
let rouletteBack='home()';
function roulette(returnTo){
  if(spinning)return; // 스핀 중 화면 전환 차단
  if(returnTo)rouletteBack=returnTo;
  wheelAngle=0; // 새 화면마다 바퀴 각도 리셋 (화살표 정렬 유지)
  app.innerHTML=`
  <div class="logo">🎯 벌칙 룰렛</div>
  <div id="wheelBox"><div class="wArrow">🔻</div><div id="wheel">${wheelSVG()}</div></div>
  <div class="rollBig" id="rollOut">운명의 버튼을 누르세요…</div>
  <button class="bigBtn red" id="spinBtn" onclick="spin()">🎰 돌려돌려!</button>
  <div class="card" style="margin-top:12px" id="penEditCard"><h3>벌칙 목록 (${PEN.length}개) — 직접 추가 가능</h3>
    <input class="nameIn" id="penIn" maxlength="20" placeholder="예: 아재개그 하나 하기">
    <button class="ghostBtn" onclick="addPen()">＋ 추가</button>
    <button class="ghostBtn" onclick="if(!spinning){PEN=PENALTY_DEFAULT.slice();roulette();}">기본 목록으로 초기화</button>
  </div>
  <button class="ghostBtn" id="rouletteBackBtn" onclick="if(!spinning){${rouletteBack.indexOf('(')>=0?rouletteBack:rouletteBack+'()'}}">← ${rouletteBack==='home()'?'메뉴로':'하던 게임으로'}</button>`;
}
function wheelSVG(){
  const n=PEN.length,R=150;
  let paths='';
  const colors=['#ff5d73','#ffc94d','#3ecf8e','#4dabff','#b78bff','#ff9f43'];
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2;
    const x0=R+R*Math.cos(a0),y0=R+R*Math.sin(a0),x1=R+R*Math.cos(a1),y1=R+R*Math.sin(a1);
    paths+=`<path d="M${R},${R} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${colors[i%colors.length]}" opacity="${0.75+0.25*(i%2)}"/>`;
  }
  return `<svg viewBox="0 0 300 300" width="300" height="300">${paths}<circle cx="150" cy="150" r="30" fill="#0d1b17"/><text x="150" y="158" text-anchor="middle" font-size="22">🎯</text></svg>`;
}
function addPen(){
  const v=$('penIn').value.trim();
  if(v){PEN.push(v);roulette();}
}
let spinning=false;
function spin(){
  if(spinning)return;
  spinning=true;ac();
  const n=PEN.length;
  const target=rnd(n);
  const result=PEN[target]; // 결과 문자열을 즉시 캡처 (스핀 중 목록 변경 대비)
  // 스핀 중 이탈/편집 버튼 잠금
  const bb=$('rouletteBackBtn'); if(bb)bb.style.opacity='.3';
  const sb=$('spinBtn'); if(sb){sb.disabled=true;sb.style.opacity='.4';}
  const seg=360/n;
  // 현재 각도를 360 배수로 올림 정렬 후, 화살표가 target 조각 중앙에 오도록
  wheelAngle=Math.ceil(wheelAngle/360)*360 + 360*5 + (360-(target*seg+seg/2));
  const wh=$('wheel'); if(wh)wh.style.transform='rotate('+wheelAngle+'deg)';
  const ro0=$('rollOut'); if(ro0)ro0.textContent='두구두구두구…';
  let t=0;const tickIv=setInterval(()=>{beep(600+rnd(200),.04,'square',.08);t+=1;if(t>30)clearInterval(tickIv);},130);
  setTimeout(()=>{
    clearInterval(tickIv);
    spinning=false; // 어떤 경우에도 잠금 해제 (아래 DOM 접근보다 먼저)
    const ro=$('rollOut');
    if(!ro)return; // 화면이 바뀌었으면 조용히 종료 (크래시 방지)
    beep(1200,.4);vib([100,50,100]);
    const sb2=$('spinBtn'); if(sb2){sb2.disabled=false;sb2.style.opacity='1';}
    const bb2=$('rouletteBackBtn'); if(bb2)bb2.style.opacity='1';
    ro.innerHTML='👉 <b>'+esc(result)+'</b>';
  },4400);
}

home();

function INGAME(){var a=document.getElementById('app');return !!(a&&a.innerHTML.indexOf('펜션게임 <span class="g">팩</span>')<0);} // 홈 화면이 아니면 게임 중

/* ---------- 📱 뒤로가기 방지: 게임 중 실수로 나가지 않도록 ---------- */
(function(){
  let warnAt=0;
  try{ history.pushState({dr:1},''); }catch(e){}
  window.addEventListener('popstate',function(){
    if(!INGAME()){ return; }
    try{ history.pushState({dr:1},''); }catch(e){}
    var ovs=document.querySelectorAll('.ovl.on,#vovl.on,#ovl.on,.overlay.on');
    if(ovs.length){ ovs[ovs.length-1].classList.remove('on'); return; } // 열린 창부터 닫기
    const now=Number(new Date());
    if(now-warnAt<2500){ history.back(); return; }
    warnAt=now;
    let t=document.getElementById('backToast');
    if(!t){ t=document.createElement('div'); t.id='backToast';
      t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2135;border:1px solid #2c3a5c;color:#eef2fb;font-size:13.5px;font-weight:700;padding:12px 18px;border-radius:24px;z-index:10001;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:88%;text-align:center';
      document.body.appendChild(t); }
    t.textContent='게임 중이에요! 정말 나가려면 뒤로가기를 한 번 더 누르세요';
    t.style.display='block';
    setTimeout(function(){ try{t.style.display='none';}catch(e){} },2500);
  });
})();
