<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>펜션게임 팩 — 6인 여행 술게임·복불복 모음</title>
<style>
:root{--bg:#0d1b17;--panel:#163028;--panel2:#1f4237;--line:#2c5a4b;--txt:#eefaf4;--sub:#8fc4ae;
--gold:#ffc94d;--green:#3ecf8e;--red:#ff5d73;--blue:#4dabff;--orange:#ff9f43}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;overscroll-behavior:none}
button{font-family:inherit;border:none;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
#app{max-width:520px;margin:0 auto;padding:18px 14px 40px;min-height:100%}
.logo{text-align:center;font-size:28px;font-weight:900;margin:8px 0 2px}
.logo .g{color:var(--green)}
.tag{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--sub);margin-bottom:10px;font-weight:700}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{padding:20px 8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);color:var(--txt);font-size:15px;font-weight:900;line-height:1.5}
.mbtn small{display:block;font-weight:600;color:var(--sub);font-size:11px;margin-top:4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;background:var(--panel2);color:var(--txt);font-size:14px;font-weight:800;border:2px solid transparent;flex:0 1 auto}
.chip.sel{border-color:var(--green);background:#2a5c47;color:#c8ffe6}
.bigBtn{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#3ecf8e,#1f9e68);color:#04150c;font-size:18px;font-weight:900;margin-top:10px}
.bigBtn.red{background:linear-gradient(135deg,#ff5d73,#d63a55);color:#fff}
.bigBtn.gold{background:linear-gradient(135deg,#ffc94d,#ff9f43);color:#1c1200}
.bigBtn.blue{background:linear-gradient(135deg,#4dabff,#3a7ce0);color:#fff}
.ghostBtn{display:block;width:100%;padding:12px;border-radius:12px;background:var(--panel2);color:var(--sub);font-size:14px;font-weight:700;margin-top:8px}
.center{text-align:center}
.sub{color:var(--sub);font-size:13px;line-height:1.7}
.big{font-size:20px;font-weight:900;line-height:1.5}
.huge{font-size:44px;font-weight:900;text-align:center;line-height:1.25;word-break:keep-all}
.mini{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
.nameIn{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px;margin-bottom:8px}
/* 이마퀴즈 전체화면 */
.fsWrap{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column}
.fsTop{flex:1;display:flex;align-items:center;justify-content:center;background:#123d2b;flex-direction:column;gap:8px;padding:16px}
.fsBottom{height:26vh;display:flex;align-items:center;justify-content:center;background:#3d1220;color:#ffb3c0;font-size:18px;font-weight:900}
.fsTop .lbl{color:#9fe8c6;font-size:15px;font-weight:800}
.fsWord{font-size:52px;font-weight:900;text-align:center;line-height:1.2;word-break:keep-all;padding:0 10px}
.fsHud{position:fixed;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;font-size:17px;font-weight:900;z-index:51}
.flash-ok{animation:fok .35s}
.flash-pass{animation:fps .35s}
@keyframes fok{0%{background:#3ecf8e}100%{background:#123d2b}}
@keyframes fps{0%{background:#ff5d73}100%{background:#3d1220}}
/* 폭탄 */
.bombWrap{padding:30px 0;text-align:center}
.bomb{font-size:110px;animation:sway 1s infinite ease-in-out}
@keyframes sway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.boomBG{position:fixed;inset:0;background:#c81e35;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.boomBG .b1{font-size:90px}.boomBG .b2{font-size:30px;font-weight:900;color:#fff}
/* 룰렛 */
#wheelBox{position:relative;width:300px;height:300px;margin:14px auto}
#wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.65,.09,1)}
.wArrow{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2}
.rollBig{font-size:26px;font-weight:900;text-align:center;padding:20px 8px;background:var(--panel2);border-radius:16px;margin-top:12px;line-height:1.4;word-break:keep-all}
.tbl{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0}
.tbl td{padding:8px 4px;border-bottom:1px solid #24503f}
.tbl td:last-child{text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:16px 0}
.vsBox{background:var(--panel2);border-radius:16px;padding:16px 10px;text-align:center;font-weight:900;line-height:1.35;word-break:keep-all;min-height:118px;display:flex;align-items:center;justify-content:center}
.vsHead{font-size:17px}
.vsSub{font-size:12.5px;font-weight:700;color:#ffd479;margin-top:7px;line-height:1.45}
.vsMid{font-size:22px;font-weight:900;color:var(--gold)}
.scoreRow{display:flex;justify-content:center;gap:18px;font-size:16px;font-weight:800;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =====================================================
   펜션게임 팩 — 폰은 소품·진행자, 노는 건 사람!
   6인 여행 최적화 · 오프라인 · 한 폰이면 충분
===================================================== */
const app=document.getElementById('app');
const $=s=>document.getElementById(s);
function rnd(n){return Math.floor(Math.random()*n);}
function pick(a){return a[rnd(a.length)];}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
/* ═══════════════════════════════════════════════════════════════
   🔊 사운드 엔진 — 파일 없이 Web Audio로 그 자리에서 음을 합성합니다.
   · 외부 mp3/wav·CDN 라이브러리 전혀 없음 (OscillatorNode + 노이즈 버퍼)
   · 게임 로직/랜덤(rnd)과 완전히 분리된 '연출 전용' 코드
   · AudioContext가 없는 환경(jsdom 테스트 등)에서는 전부 조용히 무시됩니다
═══════════════════════════════════════════════════════════════ */
const SND={ctx:null,on:true,master:null,bgmGain:null,bgmTimer:null,bgmName:'',want:'',unlocked:false,bpm:132};
function sctx(){
  if(!SND.ctx){
    try{
      const AC2=window.AudioContext||window.webkitAudioContext;
      if(!AC2)return null;                       // 오디오를 지원하지 않는 환경
      SND.ctx=new AC2();
      SND.master=SND.ctx.createGain();
      SND.master.gain.value=SND.on?0.9:0;        // 음소거는 마스터 볼륨으로 즉시 처리
      SND.master.connect(SND.ctx.destination);
      SND.bgmGain=SND.ctx.createGain();
      SND.bgmGain.gain.value=0.15;               // BGM은 효과음보다 확실히 작게
      SND.bgmGain.connect(SND.master);
    }catch(e){SND.ctx=null;return null;}
  }
  return SND.ctx;
}
/* 아이폰/안드로이드는 첫 사용자 터치 전에는 소리가 나지 않습니다.
   터치·클릭을 캡처 단계에서 먼저 잡아 AudioContext를 깨웁니다. */
function sndUnlock(){
  try{
    const c=sctx(); if(!c)return;
    if(c.state==='suspended')c.resume();
    if(!SND.unlocked){
      SND.unlocked=true;
      if(SND.want)bgmStart(SND.want);            // 잠금 때문에 미뤄둔 BGM을 지금 시작
    }
  }catch(e){}
}
try{
  ['touchstart','pointerdown','mousedown','click','keydown'].forEach(function(ev){
    document.addEventListener(ev,sndUnlock,{passive:true,capture:true});
  });
}catch(e){}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}      // MIDI 번호 → 주파수
/* 단음 하나 */
function tone(m,t0,dur,type,vol,dst){
  try{
    const c=sctx(); if(!c||!SND.on)return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(mtof(m),t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(dst||SND.master);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
/* 미끄러지는 음 (슝~ / 익살스러운 하강) */
function slide(m1,m2,t0,dur,type,vol){
  try{
    const c=sctx(); if(!c||!SND.on)return;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sawtooth';
    o.frequency.setValueAtTime(mtof(m1),t0);
    o.frequency.exponentialRampToValueAtTime(mtof(m2),t0+dur);
    g.gain.setValueAtTime(vol||0.18,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(SND.master); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
/* 노이즈 (딸깍, 치직, 폭발). lp=true면 저역만 남겨 '굵은' 소리가 됩니다.
   dst를 주면 그쪽으로 보냅니다 (BGM 하이햇은 반드시 bgmGain으로 가야 음량이 맞습니다) */
function noise(t0,dur,vol,cut,lp,dst){
  try{
    const c=sctx(); if(!c||!SND.on)return;
    const n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,Math.max(1,n),c.sampleRate);
    const dat=buf.getChannelData(0);
    for(let i=0;i<n;i++)dat[i]=(Math.random()*2-1)*(1-i/n);   // 뒤로 갈수록 잦아듦
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type=lp?'lowpass':'highpass'; f.frequency.value=cut||2000;
    const g=c.createGain(); g.gain.value=vol||0.12;
    src.connect(f); f.connect(g); g.connect(dst||SND.master); src.start(t0);
  }catch(e){}
}
/* ── 효과음 모음 (전부 0.05~0.9초 내로 짧고 또렷하게) ── */
function sfx(name){
  try{
    const c=sctx(); if(!c||!SND.on)return;
    if(c.state==='suspended'){c.resume();if(!SND.unlocked)return;} // 잠금 상태면 소리 생략
    const t=c.currentTime;
    switch(name){
      /* 공통 UI */
      case 'tap':    tone(84,t,0.05,'square',0.10); break;                     // 가벼운 딸깍
      case 'menu':   [72,79,84].forEach((m,i)=>tone(m,t+i*0.045,0.12,'square',0.15)); break; // 메뉴 진입
      case 'back':   [76,69].forEach((m,i)=>tone(m,t+i*0.07,0.12,'triangle',0.14)); break;   // 뒤로가기
      case 'select': tone(88,t,0.05,'square',0.12); tone(93,t+0.045,0.07,'square',0.10); break; // 칩 선택
      case 'add':    [79,84,88].forEach((m,i)=>tone(m,t+i*0.05,0.13,'square',0.16)); break;  // 목록에 추가
      case 'whoosh': slide(96,72,t,0.16,'sawtooth',0.10); noise(t,0.14,0.07,3000); break;    // 휙! 넘기기
      /* 카운트다운 · 시작 신호 */
      case 'count':  tone(76,t,0.10,'square',0.18); noise(t,0.05,0.06,4000); break;          // 3, 2, 1…
      case 'start':  [72,76,79,84,88].forEach((m,i)=>{tone(m,t+i*0.05,0.16,'square',0.22);tone(m-12,t+i*0.05,0.16,'triangle',0.14);});
                     noise(t,0.12,0.12,5000); break;                                          // 출발 신호!
      case 'count321': // 하나! 둘! 셋! (밸런스 게임 동시 지목)
                     tone(74,t,0.16,'square',0.2); tone(74,t+0.5,0.16,'square',0.2);
                     [84,88,93].forEach((m,i)=>tone(m,t+1.0+i*0.06,0.32,'square',0.22));
                     noise(t+1.0,0.12,0.1,5000); break;
      /* 퀴즈 */
      case 'correct':tone(88,t,0.11,'sine',0.26); tone(93,t+0.09,0.24,'sine',0.24);
                     tone(76,t,0.1,'triangle',0.12); break;                                   // 맑은 띵동
      case 'wrong':  tone(58,t,0.14,'square',0.2); tone(57,t+0.13,0.2,'square',0.2); break;   // 삑—
      case 'tick':   tone(93,t,0.05,'square',0.14); break;                                    // 남은 시간 촉박
      case 'timeup': [79,74,69,62].forEach((m,i)=>{tone(m,t+i*0.16,0.36,'square',0.2);tone(m-12,t+i*0.16,0.36,'triangle',0.14);});
                     noise(t+0.64,0.2,0.1,3000); break;                                       // 시간 종료
      case 'quizNew':[69,76,81].forEach((m,i)=>tone(m,t+i*0.06,0.2,'triangle',0.18)); break;  // 새 문제 등장
      case 'reveal': for(let i=0;i<8;i++)noise(t+i*0.05,0.05,0.1,600,true);                   // 두구두구…
                     [81,86,90].forEach((m,i)=>tone(m,t+0.42+i*0.08,0.34,'square',0.24)); break; // 정답 공개!
      case 'vs':     slide(55,67,t,0.18,'sawtooth',0.16); tone(79,t+0.2,0.14,'square',0.2);
                     tone(74,t+0.2,0.14,'square',0.16); break;                                // 대결 등장
      /* 폭탄 돌리기 */
      case 'ignite': noise(t,0.35,0.18,1800); slide(48,84,t,0.32,'sawtooth',0.12);
                     tone(72,t+0.3,0.12,'square',0.2); break;                                 // 치익—점화!
      case 'fuse':   noise(t,0.06,0.13,2600); tone(96,t,0.03,'square',0.07); break;           // 도화선 치직
      case 'boom':   noise(t,0.7,0.5,220,true); noise(t,0.25,0.3,900);                        // 굵은 저음 파열
                     slide(60,28,t,0.75,'sawtooth',0.3); slide(48,24,t+0.05,0.6,'square',0.22);
                     [40,33,28].forEach((m,i)=>tone(m,t+0.1+i*0.12,0.5,'sawtooth',0.22)); break;
      /* 벌칙 · 룰렛 */
      case 'penalty':slide(76,52,t,0.45,'square',0.2); slide(64,40,t+0.12,0.45,'sawtooth',0.14);
                     tone(45,t+0.5,0.3,'triangle',0.2); break;                                // 익살스러운 하강음
      case 'wheelSpin':{ // 딸깍딸깍… 점점 느려지는 룰렛 (약 4.3초, 뒤에 두구두구 깔림)
        let d=0,gap=0.045;
        for(let i=0;i<80&&d<4.25;i++){
          noise(t+d,0.03,0.16,4200); tone(96,t+d,0.02,'square',0.05);
          d+=gap; gap*=1.055;
        }
        for(let i=0;i<26;i++)noise(t+3.45+i*0.032,0.035,0.09,500,true); // 마지막 두구두구
        break;}
      case 'jackpot':// 팡파르! (룰렛 당첨)
        noise(t,0.15,0.16,5000);
        [84,84,84,88,91,88,91,96].forEach((m,i)=>{const tt=t+i*0.11;
          tone(m,tt,0.3,'square',0.26); tone(m-12,tt,0.3,'triangle',0.16);});
        [0,1,2].forEach(i=>noise(t+0.22*i,0.07,0.09,6000)); break;
      case 'shuffle':for(let i=0;i<6;i++){noise(t+i*0.045,0.04,0.11,3500);tone(72+i*3,t+i*0.045,0.05,'square',0.1);} break; // 다다닥 (주제 바꾸기)
    }
  }catch(e){}
}
/* ── BGM: 장면마다 어울리는 8비트 루프 (멜로디+베이스+하이햇) ──
   [음(MIDI, 0=쉼표), 길이(8분음표 단위)] 형식으로 적어둔 악보를 예약 재생합니다. */
const BGM_TRACKS={
  /* 밝고 빠른 파티 루프 — 홈·설정·결과 화면 */
  party:{bpm:134,mel:[
    [72,1],[76,1],[79,1],[76,1],[77,1],[74,1],[72,1],[0,1],
    [74,1],[77,1],[81,1],[77,1],[79,1],[76,1],[74,1],[0,1],
    [72,1],[76,1],[79,2],[81,1],[79,1],[76,2],
    [74,1],[71,1],[74,1],[77,1],[76,2],[0,2],
    [81,1],[79,1],[77,1],[76,1],[74,1],[72,1],[74,1],[76,1],
    [77,2],[76,2],[72,2],[0,2]
  /* 베이스는 멜로디와 같은 48칸이라 매 루프마다 화음이 딱 맞습니다 (C-G-Am-F-C-G) */
  ],bass:[48,0,55,0,48,0,55,0, 43,0,50,0,43,0,50,0, 45,0,52,0,45,0,52,0,
          41,0,48,0,41,0,48,0, 48,0,55,0,48,0,55,0, 43,0,50,0,43,0,50,0]},
  /* 조금 더 빠르고 통통 튀는 루프 — 스피드퀴즈 진행 중 */
  quiz:{bpm:152,mel:[
    [81,1],[84,1],[88,1],[84,1],[81,1],[84,1],[88,1],[91,1],
    [89,1],[86,1],[82,1],[86,1],[89,1],[86,1],[82,1],[79,1],
    [81,1],[81,1],[84,1],[88,1],[86,2],[84,2],
    [83,1],[86,1],[83,1],[79,1],[81,2],[0,2]
  ],bass:[45,0,52,0,45,0,52,0, 38,0,45,0,38,0,45,0, 45,0,52,0,45,0,52,0, 40,0,47,0,40,0,47,0]},
  /* 심장 쫄깃한 저음 루프 — 폭탄 돌리기 (템포가 점점 빨라집니다) */
  bomb:{bpm:112,accel:1.2,max:236,mel:[
    [60,1],[0,1],[61,1],[0,1],[60,1],[0,1],[63,1],[0,1],
    [62,1],[0,1],[63,1],[0,1],[62,1],[0,1],[65,1],[0,1]
  ],bass:[36,0,36,0,36,0,36,0, 38,0,38,0,38,0,38,0]}
};
function bgmStart(name){
  try{
    SND.want=name||'party';
    if(SND.bgmName===SND.want&&SND.bgmTimer)return;   // 같은 트랙이면 끊지 않고 이어서
    bgmStop();
    const tr=BGM_TRACKS[SND.want]; if(!tr)return;
    const c=sctx(); if(!c||!SND.on||!SND.unlocked)return; // 첫 터치 전에는 예약만 해둠
    if(c.state==='suspended')c.resume();
    SND.bgmName=SND.want; SND.bpm=tr.bpm;
    let idx=0,bi=0,next=c.currentTime+0.12;
    SND.bgmTimer=setInterval(function(){
      try{
        if(!SND.on)return;
        const now=c.currentTime;
        while(next<now+0.25){
          const spb=60/SND.bpm/2;                        // 8분음표 한 칸 길이
          const note=tr.mel[idx%tr.mel.length];
          if(note[0]>0)tone(note[0],next,spb*note[1]*0.92,'square',0.13,SND.bgmGain);
          const b=tr.bass[bi%tr.bass.length];
          if(b>0)tone(b,next,spb*0.9,'triangle',0.2,SND.bgmGain);
          if(bi%2===0)noise(next,0.03,0.08,6000,false,SND.bgmGain); // 하이햇도 BGM 버스를 타야 멜로디에 안 묻힘
          next+=spb*note[1]; idx++; bi+=note[1];
          if(tr.accel&&SND.bpm<tr.max)SND.bpm=Math.min(tr.max,SND.bpm+tr.accel*note[1]); // 폭탄: 점점 빠르게!
        }
      }catch(e){}
    },60);
  }catch(e){}
}
function bgmStop(){
  try{ if(SND.bgmTimer){clearInterval(SND.bgmTimer);SND.bgmTimer=null;} SND.bgmName=''; }catch(e){}
}

function soundToggle(){

function ac(){return sctx();}
function beep(freq,dur,type,vol){
  try{
    const c=sctx(); if(!c||!SND.on)return;
    if(c.state==='suspended'){c.resume();if(!SND.unlocked)return;}
    const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(vol||0.15,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+(dur||0.1));
    o.connect(g); g.connect(SND.master);
    o.start(t); o.stop(t+(dur||0.1)+0.02);
  }catch(e){}
}

/* 초성 추출 */
const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function choseong(str){
  let out='';
  for(const ch of str){
    const code=ch.charCodeAt(0);
    if(code>=0xAC00&&code<=0xD7A3)out+=CHO[Math.floor((code-0xAC00)/588)];
    else if(ch===' ')out+=' ';        // 띄어쓰기는 힌트로 유지
    else out+='·';                    // 숫자·영문은 가려서 정답 유출 방지
  }
  return out;
}
function glyphLen(str){return [...str].filter(c=>c!==' ').length;} // 공백 제외 글자수

let qzTimer=null, qzNextT=null, qzOver=false;
function quizGo(){
  ac(); // 사용자 제스처로 오디오 잠금 해제
  if(qzTimer){clearInterval(qzTimer);qzTimer=null;}
  if(qzNextT){clearTimeout(qzNextT);qzNextT=null;}
  qzOver=false;
  QZ.words=shuffle(WORDS[QZ.cat]);
  QZ.idx=0;QZ.score=0;QZ.left=QZ.sec;QZ.log=[];
  let cd=3;
  const paint=()=>{app.innerHTML=`<div class="fsWrap"><div class="fsTop"><div class="huge">${cd>0?cd:'시작!'}</div>
    <div class="lbl">${QZ.kind==='head'?'폰을 이마로!':'설명 준비!'}</div></div></div>`;};
  paint();sfx('count');                     // 3…2…1 카운트다운
  const iv=setInterval(()=>{cd--;paint();
    if(cd<=0){clearInterval(iv);sfx('start');bgmStart('quiz');quizRound();} // 시작 신호 + 빠른 퀴즈 루프
    else sfx('count');
  },900);
}
function quizRound(){
  if(qzOver||QZ.left<=0)return; // 종료 후 유령 라운드 방지
  if(QZ.idx>=QZ.words.length)QZ.words=QZ.words.concat(shuffle(WORDS[QZ.cat]));
  const w=QZ.words[QZ.idx];
  app.innerHTML=`
  <div class="fsHud"><span>⏱ <span id="qLeft">${QZ.left}</span></span><span>✅ ${QZ.score}</span></div>
  <div class="fsWrap">
    <div class="fsTop" id="okZone"><div class="lbl">맞히면 여기(위쪽) 탭!</div><div class="fsWord">${esc(w)}</div></div>
    <div class="fsBottom" id="passZone">어려우면 여기 탭 (패스)</div>
  </div>`;
  $('okZone').onclick=()=>{QZ.score++;QZ.log.push([w,true]);sfx('correct');vib(30);QZ.idx++;quizNext('ok');};   // 정답 띵동
  $('passZone').onclick=()=>{QZ.log.push([w,false]);sfx('wrong');vib([20,40,20]);QZ.idx++;quizNext('pass');};  // 오답/패스 삑
  if(!qzTimer){
    qzTimer=setInterval(()=>{
      QZ.left--;
      const el=$('qLeft');if(el)el.textContent=QZ.left;
      if(QZ.left<=5&&QZ.left>0)sfx('tick');   // 마지막 5초 초읽기
      if(QZ.left<=0){clearInterval(qzTimer);qzTimer=null;quizEnd();}
    },1000);
  }
}
function quizNext(kind){
  if(qzOver)return;
  if(kind==='pass')sfx('whoosh');            // 휙! 다음 단어로 넘기기
  const top=document.querySelector('.fsTop');
  if(top)top.classList.add(kind==='ok'?'flash-ok':'flash-pass');
  if(qzNextT)clearTimeout(qzNextT);
  qzNextT=setTimeout(()=>{qzNextT=null;quizRound();},120);
}
function quizEnd(){
  qzOver=true;
  if(qzTimer){clearInterval(qzTimer);qzTimer=null;}
  if(qzNextT){clearTimeout(qzNextT);qzNextT=null;}
  boomlessEnd();
}

  ac();
  sfx('ignite'); bgmStart('bomb');           // 치익—점화! 이후 BGM 템포가 점점 빨라집니다
  const fuse=10000+rnd(25000);

    t+=gap;

  };
  bombTimers.push(setTimeout(tick,300));

/* 선택지를 '본문 + 단서(단 …)' 두 줄로 나눠 보여준다.
   양쪽에 대가가 붙어야 진짜 고민이 되므로, 단서가 잘 읽히는 게 중요하다. */
function vsHTML(t){
  let head=String(t), sub='';
  const nl=head.indexOf('\n');
  if(nl>=0){ sub=head.slice(nl+1).trim(); head=head.slice(0,nl); }
  const m=head.match(/^(.*?),\s*(단 .*)$/);          // '단 …' 조건은 항상 아래 줄로
  if(m){ head=m[1]; sub=(m[2]+(sub?' '+sub:'')).trim(); }
  return '<div><div class="vsHead">'+esc(head)+'</div>'+
    (sub?'<div class="vsSub">'+esc(sub)+'</div>':'')+'</div>';
}
function balanceGame(i,deck){

  if(i>=deck.length){deck=shuffle(BALANCE);i=0;}
  const [a,b]=deck[i];

  app.innerHTML=`
  <div class="logo">⚖️ 밸런스 게임</div>
  <div class="vs">
    <div class="vsBox">${vsHTML(a)}</div><div class="vsMid">VS</div><div class="vsBox">${vsHTML(b)}</div>

  <div class="rollBig" id="rollOut">운명의 버튼을 누르세요…</div>
  <button class="bigBtn red" id="spinBtn" onclick="spin()">🎰 돌려돌려!</button>
  <div class="card" style="margin-top:12px" id="penEditCard"><h3>벌칙 목록 (${PEN.length}개) — 직접 추가 가능</h3>
    <input class="nameIn" id="penIn" maxlength="20" placeholder="예: 아재개그 하나 하기">
    <button class="ghostBtn" onclick="addPen()">＋ 추가</button>
    <button class="ghostBtn" onclick="if(!spinning){sfx('tap');PEN=PENALTY_DEFAULT.slice();roulette();}">기본 목록으로 초기화</button>
  </div>
  <button class="ghostBtn" id="rouletteBackBtn" onclick="if(!spinning){${rouletteBack.indexOf('(')>=0?rouletteBack:rouletteBack+'()'}}">← ${rouletteBack==='home()'?'메뉴로':'하던 게임으로'}</button>`;
}
function wheelSVG(){
  const n=PEN.length,R=150;
  let paths='';
  const colors=['#ff5d73','#ffc94d','#3ecf8e','#4dabff','#b78bff','#ff9f43'];
  for(let i=0;i<n;i++){
    const a0=(i/n)*2*Math.PI-Math.PI/2, a1=((i+1)/n)*2*Math.PI-Math.PI/2;
    const x0=R+R*Math.cos(a0),y0=R+R*Math.sin(a0),x1=R+R*Math.cos(a1),y1=R+R*Math.sin(a1);
    paths+=`<path d="M${R},${R} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${colors[i%colors.length]}" opacity="${0.75+0.25*(i%2)}"/>`;
  }
  return `<svg viewBox="0 0 300 300" width="300" height="300">${paths}<circle cx="150" cy="150" r="30" fill="#0d1b17"/><text x="150" y="158" text-anchor="middle" font-size="22">🎯</text></svg>`;
}
function addPen(){
  const v=$('penIn').value.trim();
  if(v){sfx('add');PEN.push(v);roulette();}   // 목록에 추가 완료음
  else sfx('wrong');                          // 빈칸이면 '안 됐어요' 신호음
}
let spinning=false;
function spin(){
  if(spinning)return;
  spinning=true;ac();
  const n=PEN.length;
  const target=rnd(n);
  const result=PEN[target]; // 결과 문자열을 즉시 캡처 (스핀 중 목록 변경 대비)
  // 스핀 중 이탈/편집 버튼 잠금
  const bb=$('rouletteBackBtn'); if(bb)bb.style.opacity='.3';
  const sb=$('spinBtn'); if(sb){sb.disabled=true;sb.style.opacity='.4';}
  const seg=360/n;
  // 현재 각도를 360 배수로 올림 정렬 후, 화살표가 target 조각 중앙에 오도록
  wheelAngle=Math.ceil(wheelAngle/360)*360 + 360*5 + (360-(target*seg+seg/2));
  const wh=$('wheel'); if(wh)wh.style.transform='rotate('+wheelAngle+'deg)';
  const ro0=$('rollOut'); if(ro0)ro0.textContent='두구두구두구…';
  sfx('wheelSpin');                           // 딸깍딸깍… 점점 느려지다 마지막에 두구두구
  setTimeout(()=>{
    spinning=false; // 어떤 경우에도 잠금 해제 (아래 DOM 접근보다 먼저)
    const ro=$('rollOut');
    if(!ro)return; // 화면이 바뀌었으면 조용히 종료 (크래시 방지)
    sfx('jackpot');vib([100,50,100]);         // 팡파르!
    setTimeout(()=>{try{if(String(result).indexOf('통과')<0)sfx('penalty');}catch(e){}},950); // 벌칙이면 익살 하강음 한 번 더
    const sb2=$('spinBtn'); if(sb2){sb2.disabled=false;sb2.style.opacity='1';}
    const bb2=$('rouletteBackBtn'); if(bb2)bb2.style.opacity='1';
    ro.innerHTML='👉 <b>'+esc(result)+'</b>';
  },4400);
}

home();

function INGAME(){var a=document.getElementById('app');return !!(a&&a.innerHTML.indexOf('펜션게임 <span class="g">팩</span>')<0);} // 홈 화면이 아니면 게임 중

/* ---------- 📱 뒤로가기 방지: 게임 중 실수로 나가지 않도록 ---------- */
(function(){
  let warnAt=0;
  try{ history.pushState({dr:1},''); }catch(e){}
  window.addEventListener('popstate',function(){
    if(!INGAME()){ return; }
    try{ history.pushState({dr:1},''); }catch(e){}
    var ovs=document.querySelectorAll('.ovl.on,#vovl.on,#ovl.on,.overlay.on');
    if(ovs.length){ ovs[ovs.length-1].classList.remove('on'); return; } // 열린 창부터 닫기
    const now=Number(new Date());
    if(now-warnAt<2500){ history.back(); return; }
    warnAt=now;
    let t=document.getElementById('backToast');
    if(!t){ t=document.createElement('div'); t.id='backToast';
      t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2135;border:1px solid #2c3a5c;color:#eef2fb;font-size:13.5px;font-weight:700;padding:12px 18px;border-radius:24px;z-index:10001;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:88%;text-align:center';
      document.body.appendChild(t); }
    t.textContent='게임 중이에요! 정말 나가려면 뒤로가기를 한 번 더 누르세요';
    t.style.display='block';
    setTimeout(function(){ try{t.style.display='none';}catch(e){} },2500);
  });
})();

</script>
