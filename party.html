<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-파티게임 — 라이어게임 & 마피아</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<style>
:root{--bg:#12101c;--panel:#1e1a2e;--panel2:#2a2440;--line:#3a3158;--txt:#f0edfa;--sub:#a89cc8;
--gold:#ffc94d;--green:#3ecf8e;--red:#ff5d73;--blue:#4dabff;--purple:#b78bff}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;overscroll-behavior:none}
button{font-family:inherit;border:none;cursor:pointer}
input{user-select:text;-webkit-user-select:text}
#app{max-width:520px;margin:0 auto;padding:20px 16px 40px;min-height:100%}
.logo{text-align:center;font-size:30px;font-weight:900;margin:10px 0 4px}
.logo .g{color:var(--purple)}
.tag{text-align:center;color:var(--sub);font-size:13px;margin-bottom:18px;line-height:1.6}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h3{font-size:13px;color:var(--sub);margin-bottom:10px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{flex:1;min-width:60px;padding:12px 6px;border-radius:12px;background:var(--panel2);color:var(--txt);font-size:15px;font-weight:800;border:2px solid transparent}
.chip.sel{border-color:var(--purple);background:#3b3160;color:#e6d9ff}
.chip.sm{font-size:13px;padding:9px 4px;min-width:46px;flex:0 1 auto}
.nameIn{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px;margin-bottom:8px}
.bigBtn{display:block;width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,#b78bff,#7d5fff);color:#fff;font-size:18px;font-weight:900;margin-top:8px}
.bigBtn.gold{background:linear-gradient(135deg,#ffc94d,#ff9f43);color:#1c1200}
.bigBtn.red{background:linear-gradient(135deg,#ff5d73,#d63a55)}
.bigBtn.green{background:linear-gradient(135deg,#3ecf8e,#2aa46d);color:#04150c}
.bigBtn:disabled{opacity:.35}
.ghostBtn{display:block;width:100%;padding:12px;border-radius:12px;background:var(--panel2);color:var(--sub);font-size:14px;font-weight:700;margin-top:8px}
.center{text-align:center}
.hugeWord{font-size:38px;font-weight:900;text-align:center;padding:34px 10px;background:var(--panel2);border-radius:18px;margin:14px 0;line-height:1.3;border:2px solid var(--line)}
.roleMafia{color:var(--red)} .rolePolice{color:var(--blue)} .roleDoctor{color:var(--green)} .roleCitizen{color:var(--gold)} .roleLiar{color:var(--red)}
.holdBtn{display:block;width:100%;padding:24px;border-radius:16px;background:var(--panel2);border:2px dashed var(--purple);color:var(--purple);font-size:17px;font-weight:900;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.pick{padding:16px 8px;border-radius:12px;background:var(--panel2);color:var(--txt);font-size:16px;font-weight:800;border:2px solid transparent}
.pick.sel{border-color:var(--gold);background:#453a20;color:var(--gold)}
.pick.dead{opacity:.3;text-decoration:line-through}
.pick:disabled{opacity:.3}
.timer{font-size:56px;font-weight:900;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
.timer.low{color:var(--red);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.4}}
.sub{color:var(--sub);font-size:13px;line-height:1.7}
.big{font-size:19px;font-weight:900;line-height:1.5}
.tbl{width:100%;font-size:14px;border-collapse:collapse;margin:8px 0}
.tbl td{padding:8px 4px;border-bottom:1px solid #352c52}
.tbl td:last-child{text-align:right}
.stepRow{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.stepRow .qbtn{width:42px;height:42px;border-radius:12px;background:var(--panel2);color:var(--txt);font-size:20px;font-weight:900}
.codeBox{font-size:32px;font-weight:900;letter-spacing:8px;color:var(--gold);text-align:center;padding:12px;background:#171226;border-radius:12px;margin:10px 0}
.banner{background:#152238;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#d5ddf0;line-height:1.6;margin:10px 0}
.banner b{color:var(--gold)}
#netBanner{display:none;position:fixed;top:0;left:0;right:0;background:#d63a55;color:#fff;font-size:13px;font-weight:800;text-align:center;padding:8px;z-index:90}
/* 🔊 버튼이 '탭하여 재접속' 배너를 덮어 오탭되지 않도록, 배너가 보일 때만 아래로 비켜줍니다 */
#netBanner[style*="block"]~#btnSnd{top:46px!important}
.mini{font-size:12px;color:var(--sub);text-align:center;margin-top:6px}
.tagRole{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:800;margin-left:6px}
</style>
</head>
<body>
<script>
window.addEventListener('error',function(ev){
  try{
    var b=document.getElementById('jsErrBar');
    if(!b){b=document.createElement('div');b.id='jsErrBar';
      b.style.cssText='position:fixed;bottom:0;left:0;right:0;background:#d63a55;color:#fff;font-size:11px;padding:6px 10px;z-index:99999;word-break:break-all';
      document.body.appendChild(b);}
    b.textContent='⚠️ 오류: '+(ev.message||'')+' @'+(ev.lineno||'');
  }catch(e){}
});
</script>
<div id="netBanner"></div>
<div id="app"></div>

<script>
'use strict';
/* =====================================================
   K-파티게임: 라이어게임(일반/바보) + 마피아
   실제 대화는 얼굴 보고! 폰은 비밀 배분과 진행만.
   한 폰 돌려보기 모드 + 각자 폰 온라인 모드
===================================================== */
const $=s=>document.getElementById(s);
const app=document.getElementById('app');
function rnd(n){return Math.floor(Math.random()*n);}
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=rnd(i+1);[b[i],b[j]]=[b[j],b[i]];}return b;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 라이어게임 제시어 ---------- */
const WORDS={
'음식':['김치찌개','삼겹살','치킨','떡볶이','피자','초밥','짜장면','짬뽕','냉면','비빔밥','삼계탕','부대찌개','갈비탕','순대국','라면','김밥','돈까스','족발','보쌈','마라탕','햄버거','파스타','설렁탕','감자탕','닭갈비','제육볶음','계란찜','불고기','쭈꾸미','곱창'],
'과일/간식':['사과','바나나','수박','딸기','포도','복숭아','귤','붕어빵','호떡','팥빙수','아이스크림','마카롱','도넛','케이크','추로스','솜사탕','군고구마','옥수수','호두과자','약과','인절미','꿀떡','샤인머스캣','망고','파인애플'],
'동물':['강아지','고양이','호랑이','사자','코끼리','기린','팬더','펭귄','돌고래','상어','독수리','부엉이','다람쥐','고슴도치','수달','너구리','여우','늑대','악어','하마','캥거루','코알라','미어캣','알파카','햄스터','앵무새','문어','해파리'],
'장소':['노래방','피시방','찜질방','편의점','영화관','놀이공원','수영장','도서관','미용실','병원','학교','공항','지하철역','해수욕장','캠핑장','전통시장','백화점','카페','헬스장','목욕탕','경찰서','소방서','동물원','식물원','박물관','한강공원','스키장'],
'직업':['의사','간호사','경찰관','소방관','선생님','요리사','가수','배우','유튜버','프로게이머','운동선수','변호사','판사','군인','농부','어부','파일럿','승무원','미용사','개발자','건축가','수의사','약사','기자','아이돌','웹툰작가','택배기사','바리스타'],
'물건':['우산','칫솔','베개','이불','선풍기','에어컨','냉장고','세탁기','텔레비전','리모컨','충전기','이어폰','마우스','키보드','가위','풀','지우개','필통','물티슈','텀블러','마스크','거울','드라이기','청소기','전자레인지','밥솥','손톱깎이','모기향'],
'스포츠/취미':['축구','야구','농구','배구','수영','볼링','당구','골프','태권도','유도','탁구','배드민턴','테니스','스키','보드게임','낚시','등산','캠핑','요가','필라테스','클라이밍','러닝','자전거','서핑','복싱','양궁'],
'탈것':['버스','지하철','택시','기차','비행기','헬리콥터','자전거','오토바이','킥보드','유람선','케이블카','트럭','소방차','구급차','경찰차','포클레인','스쿨버스','KTX','잠수함','열기구','캠핑카','오리배'],
};
const CATS=Object.keys(WORDS);

/* ---------- 전역 상태 ---------- */
let NET=null;      // null | {host:true,conns,names,dead} | {host:false,c,names}
let myPid=0, myName='', roomCode='', peer=null, myToken=null;
let SC={};         // 현재 화면 상태(로컬 진행용)
let LG=null;       // 라이어 게임 상태 (호스트/로컬)
let MG=null;       // 마피아 게임 상태 (호스트/로컬)
let myPriv=null;   // 온라인: 내 비밀 정보
let lastScene=null;// 온라인 호스트: 마지막 공개 장면(재접속 복구용)
let timerIv=null;

/* ---------- 화면 렌더 ---------- */
function render(html){clearTimer();app.innerHTML=html;}
function clearTimer(){if(timerIv){clearInterval(timerIv);timerIv=null;}}
function startTimer(sec,elId,onEnd){
  clearTimer();
  let left=sec;
  const el=()=>document.getElementById(elId);
  const paint=()=>{const e=el();if(!e)return;
    e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    e.classList.toggle('low',left<=10);};
  paint();
  timerIv=setInterval(()=>{left--;
    if(left<0){clearTimer();sfx('buzz');if(onEnd)onEnd();return;} // 🔊 시간 종료 부저
    if(left<=5&&left>0)sfx('tick');                               // 🔊 마지막 5초 초읽기
    paint();},1000);
}

/* =====================================================
   홈 & 설정
===================================================== */
let selGame='liar', selMode='local';
function home(){
  bgmSet('lobby'); // 🔊 홈은 왁자지껄한 로비 음악
  NET=null;myPriv=null;LG=null;MG=null;
  if(peer){try{peer.destroy();}catch(e){}peer=null;}
  $('netBanner')&&($('netBanner').style.display='none');
  render(`
  <div class="logo">🎭 K-<span class="g">파티게임</span></div>
  <div class="tag">라이어게임 & 마피아 — 대화는 얼굴 보고, 진행은 폰이!</div>
  <div class="card"><h3>🎮 게임 선택</h3>
    <div class="chips">
      <button class="chip ${selGame==='liar'?'sel':''}" onclick="selGame='liar';home()">🤥 라이어게임</button>
      <button class="chip ${selGame==='mafia'?'sel':''}" onclick="selGame='mafia';home()">🔪 마피아</button>
    </div>
  </div>
  <div class="card"><h3>📱 플레이 방식</h3>
    <div class="chips">
      <button class="chip ${selMode==='local'?'sel':''}" onclick="selMode='local';home()">🏠 한 폰 돌려보기</button>
      <button class="chip ${selMode==='net'?'sel':''}" onclick="selMode='net';home()">📶 각자 폰으로</button>
    </div>
    ${selMode==='net'?'<div class="mini">전원 인터넷 연결 필요 · 방장이 코드를 만들어 공유</div>':''}
  </div>
  ${selMode==='local'?localSetupHTML():netLobbyHTML()}
  <div class="banner">💡 <b>라이어게임</b>: 한 명(라이어)만 제시어를 몰라요. 돌아가며 제시어를 설명하고 라이어를 찾아내세요! <b>바보 모드</b>에선 라이어가 자신이 라이어인지도 모릅니다(다른 단어를 받음).<br><br>
  🔪 <b>마피아</b>: 밤엔 폰이 사회자가 되어 마피아·경찰·의사가 몰래 행동하고, 낮엔 얼굴 보고 토론해서 범인을 찾아냅니다.</div>`);
  if(selMode==='local')buildNameInputs();
}
let localCnt=(selGame==='mafia')?5:4;
function localSetupHTML(){
  const min=selGame==='mafia'?4:3, max=12;
  if(localCnt<min)localCnt=min;
  let chips='';
  for(let i=min;i<=max;i++)chips+=`<button class="chip sm ${localCnt===i?'sel':''}" onclick="localCnt=${i};home()">${i}</button>`;
  return `<div class="card"><h3>👥 인원 (${min}~${max}명)</h3><div class="chips">${chips}</div></div>
  <div class="card"><h3>✏️ 이름</h3><div id="nameBox"></div></div>
  <button class="bigBtn" onclick="startLocal()">${selGame==='liar'?'🤥 라이어게임 시작':'🔪 마피아 시작'}</button>`;
}
let savedNames=[];
function buildNameInputs(){
  const nb=document.getElementById('nameBox');if(!nb)return;
  nb.innerHTML='';
  for(let i=0;i<localCnt;i++){
    const inp=document.createElement('input');
    inp.className='nameIn';inp.maxLength=8;inp.placeholder='플레이어 '+(i+1);
    if(savedNames[i])inp.value=savedNames[i];
    inp.oninput=()=>{savedNames[i]=inp.value;};
    nb.appendChild(inp);
  }
}
function readNames(){
  return [...document.querySelectorAll('#nameBox input')].map((x,i)=>x.value.trim()||('플레이어'+(i+1)));
}
function startLocal(){
  const names=readNames();
  if(selGame==='liar')liarSettings(names,false);
  else mafiaSettings(names,false);
}

/* =====================================================
   온라인 로비 (공용)
===================================================== */
function netLobbyHTML(){
  return `<div class="card"><h3>📶 온라인 접속</h3>
    <input class="nameIn" id="myNameIn" maxlength="8" placeholder="내 이름" value="${esc(myName)}">
    <div class="chips">
      <button class="chip" onclick="hostRoom()">🏠 방 만들기</button>
      <button class="chip" onclick="showJoin()">🚪 참여하기</button>
    </div>
    <input class="nameIn" id="joinCodeIn" maxlength="4" placeholder="초대 코드 4글자" style="display:none;margin-top:8px;text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:20px;font-weight:900">
    <div id="lobbyInfo" class="sub" style="margin-top:10px"></div>
  </div>`;
}
const ICE_CFG={config:{iceServers:[
 {urls:'stun:stun.l.google.com:19302'},
 {urls:'stun:stun1.l.google.com:19302'},
 {urls:'stun:stun.cloudflare.com:3478'}
]}};
function netDiag(msg){ // 연결 문제 진단 표시
  sfx('error'); // 🔊 연결 실패
  const li=document.getElementById('lobbyInfo');
  if(li)li.innerHTML='<b style="color:#ff5d73">'+msg+'</b><br><small>· 와이파이/데이터가 켜져 있나요?<br>· 아이폰: 설정→Safari→고급→실험적 기능은 건드리지 않아도 됩니다. <b>개인정보 보호 브라우징(시크릿 모드)을 끄고</b> 일반 탭에서 열어주세요.<br>· 같은 방이면 한 명이 <b>핫스팟</b>을 켜고 모두 그 핫스팟에 접속하면 가장 안정적입니다.</small><br><button class="chip" onclick="location.reload()" style="margin-top:8px">🔄 새로고침</button>';
}
function makeCode(){const CS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=CS[rnd(CS.length)];return c;}
function nameOK(){const el=$('myNameIn');myName=el?el.value.trim():myName;
  if(!myName){sfx('error');$('lobbyInfo').innerHTML='<b style="color:var(--red)">이름을 먼저 입력하세요!</b>';return false;}return true;} // 🔊 입력 누락
function showJoin(){const j=$('joinCodeIn');
  if(j.style.display==='none'){j.style.display='block';j.focus();
    $('lobbyInfo').innerHTML='코드를 입력하고 다시 [참여하기]를 누르세요.';return;}
  if(!nameOK())return;
  const code=j.value.trim().toUpperCase();
  if(code.length!==4){sfx('error');$('lobbyInfo').innerHTML='<b style="color:var(--red)">코드는 4글자!</b>';return;} // 🔊 코드 오류
  roomCode=code;clientConnect();
}
function hostRoom(){
  if(typeof Peer==='undefined'){$('lobbyInfo').innerHTML='<b style="color:var(--red)">인터넷 연결 필요!</b> 새로고침 후 다시 시도하세요.';return;}
  if(!nameOK())return;
  roomCode=makeCode();
  $('lobbyInfo').innerHTML='방 만드는 중…';
  peer=new Peer('kpg-'+roomCode,ICE_CFG);
  let hostOpened=false;
  peer.on('open',()=>{hostOpened=true;sfx('code');NET={host:true,conns:[],names:[myName],dead:{}};myPid=0;renderHostLobby();}); // 🔊 초대 코드 발급
  setTimeout(()=>{if(!hostOpened)netDiag('📡 게임 서버에 연결하지 못했습니다.');},10000);
  peer.on('connection',c=>{
    c.on('data',d=>hostOnData(c,d));
    c.on('close',()=>hostDrop(c));
    c.on('error',()=>hostDrop(c));
  });
  peer.on('error',e=>{
    if(String(e.type)==='unavailable-id'){try{peer.destroy();}catch(x){};hostRoom();}
    else{const li=$('lobbyInfo');if(li)li.innerHTML='<b style="color:var(--red)">연결 오류: '+e.type+'</b>';}
  });
}
function clientConnect(){
  if(typeof Peer==='undefined')return;
  $('lobbyInfo')&&($('lobbyInfo').innerHTML='접속 중…');
  if(peer){try{peer.destroy();}catch(e){}}
  peer=new Peer(undefined,ICE_CFG);
  peer.on('open',()=>{
    const c=peer.connect('kpg-'+roomCode,{reliable:true});
    let opened=false;
    c.on('open',()=>{opened=true;NET={host:false,c,names:[]};c.send({t:'hello',name:myName,token:myToken});});

function mafiaNightResolve(){
  // 마피아 다수결 (동률 시 랜덤)
  const mafPicks=[];
  MG.names.forEach((_,i)=>{if(MG.alive[i]&&MG.roles[i]==='mafia'&&MG.nightPicks[i]!=null)mafPicks.push(MG.nightPicks[i]);});
  let kill=null;
  if(mafPicks.length){
    const cnt={};mafPicks.forEach(k=>cnt[k]=(cnt[k]||0)+1);
    const mx=Math.max(...Object.values(cnt));
    const top=Object.keys(cnt).filter(k=>cnt[k]===mx).map(Number);
    kill=top[rnd(top.length)];
  }
  let heal=null;
  MG.names.forEach((_,i)=>{if(MG.alive[i]&&MG.roles[i]==='doctor'&&MG.nightPicks[i]!=null)heal=MG.nightPicks[i];});
  const saved=kill!=null&&kill===heal;
  const killedName=(kill!=null&&!saved)?MG.names[kill]:null;
  if(kill!=null&&!saved)MG.alive[kill]=false;
  // 경찰 결과
  MG.polResults={};
  MG.names.forEach((_,i)=>{
    if(MG.roles[i]==='police'&&MG.nightPicks[i]!=null){
      const t=MG.nightPicks[i];
      MG.polResults[i]={name:MG.names[t],isMafia:MG.roles[t]==='mafia'};
    }
  });
  MG.phase='day';MG.lastKilled=killedName;MG.lastSaved=saved;
  // 승패 판정은 아침 결과를 '보여준 뒤' (투표 시작 시점)에 — 마지막 희생자 연출이 잘리지 않도록
  if(MG.isNet){
    // 경찰에게 비밀 결과 전송
    Object.keys(MG.polResults).forEach(i=>{
      i=+i;
      const pr={...myPrivOf[i],polres:MG.polResults[i]};
      myPrivOf[i]=pr;
      if(i===0)myPriv=pr; else sendTo(i,{t:'priv',data:pr});
    });
    lastScene={t:'scene',s:'morning',round:MG.round,killed:killedName,saved,
      alive:MG.alive.slice(),names:MG.names};
    netAll(lastScene);
    morningScreen(lastScene,true);
  } else {
    morningScreen({round:MG.round,killed:killedName,saved,alive:MG.alive,names:MG.names},false);
  }

/* ═══════════════ 🔊 사운드 엔진 (파일 없이 Web Audio로 직접 합성) ═══════════════
   게임 로직·PeerJS 동기화와 완전히 분리된 '연출 전용' 코드입니다.
   jsdom 등 AudioContext가 없는 환경에서는 sctx()가 null을 돌려주고 전부 조용히 넘어갑니다. */
const SND={ctx:null,on:true,master:null,bgmGain:null,bgmTimer:null,
           track:null,want:null,switchT:null,drone:null,droneGain:null,lastAt:0,kicked:false};
function sctx(){
  if(!SND.ctx){
    try{ SND.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
    if(!SND.ctx)return null;
    SND.master=SND.ctx.createGain(); SND.master.gain.value=0.9; SND.master.connect(SND.ctx.destination);
    SND.bgmGain=SND.ctx.createGain(); SND.bgmGain.gain.value=0.15; SND.bgmGain.connect(SND.master);
  }
  return SND.ctx;
}
function sndUnlock(){ // 아이폰/안드로이드는 첫 터치가 있어야 소리가 납니다
  const c=sctx(); if(!c)return;
  try{ if(c.state==='suspended')c.resume(); }catch(e){}
  if(!SND.kicked){ // 첫 터치 순간에 배경음악을 처음부터 다시 깔아줍니다
    SND.kicked=true;
    if(SND.want){ const w=SND.want; bgmStop(); SND.track=null; bgmSet(w); }
  }
}

document.addEventListener('click',sndUnlock);
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
/* 단음 */
function tone(m,t0,dur,type,vol,dst){
  const c=sctx(); if(!c||!SND.on)return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(mtof(m),t0);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2),t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(dst||SND.master);
    o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
/* 미끄러지는 음 (슝~ / 어두운 하강음) */
function slide(m1,m2,t0,dur,type,vol){
  const c=sctx(); if(!c||!SND.on)return;
  try{
    const o=c.createOscillator(),g=c.createGain();
    o.type=type||'sawtooth';
    o.frequency.setValueAtTime(mtof(m1),t0);
    o.frequency.exponentialRampToValueAtTime(mtof(m2),t0+dur);
    g.gain.setValueAtTime(vol||0.18,t0);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(SND.master); o.start(t0); o.stop(t0+dur+0.03);
  }catch(e){}
}
/* 노이즈 (드럼롤, 도장, 새소리 배경) */
function noise(t0,dur,vol,hp){
  const c=sctx(); if(!c||!SND.on)return;
  try{
    const n=Math.floor(c.sampleRate*dur);
    const buf=c.createBuffer(1,Math.max(1,n),c.sampleRate);
    const dat=buf.getChannelData(0);
    for(let i=0;i<n;i++)dat[i]=(Math.random()*2-1)*(1-i/n);
    const src=c.createBufferSource(); src.buffer=buf;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp||2000;
    const g=c.createGain(); g.gain.value=vol||0.12;
    src.connect(f); f.connect(g); g.connect(SND.master); src.start(t0);
  }catch(e){}
}

/* 불길한 지속음(드론) — 밤 전용 */
function droneStart(list){
  const c=sctx(); if(!c||!SND.on)return;
  droneStop();
  try{
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=360;
    const g=c.createGain();
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16,c.currentTime+1.8);
    f.connect(g); g.connect(SND.bgmGain);
    SND.drone=[];
    list.forEach((m,i)=>{
      const o=c.createOscillator();
      o.type=i?'triangle':'sawtooth'; o.frequency.value=mtof(m); o.detune.value=i*9-5;
      o.connect(f); o.start(); SND.drone.push(o);
    });
    SND.droneGain=g;
  }catch(e){}
}
function droneStop(){
  try{
    const c=SND.ctx;
    if(c&&SND.droneGain){
      const t=c.currentTime;
      SND.droneGain.gain.cancelScheduledValues(t);
      SND.droneGain.gain.setValueAtTime(Math.max(0.0002,SND.droneGain.gain.value),t);
      SND.droneGain.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    }
    if(c&&SND.drone)SND.drone.forEach(o=>{try{o.stop(c.currentTime+0.6);}catch(e){}});
  }catch(e){}
  SND.drone=null; SND.droneGain=null;
}
function bgmStart(){
  const c=sctx(); if(!c||!SND.on||SND.bgmTimer)return;
  const cfg=BGM_TRACKS[SND.track]; if(!cfg)return;
  try{ if(c.state==='suspended')c.resume(); }catch(e){}
  if(cfg.drone)droneStart(cfg.drone);
  const spb=60/cfg.bpm/2; // 8분음표 하나의 길이
  let idx=0, bi=0, next=c.currentTime+0.12;
  SND.bgmTimer=setInterval(()=>{
    if(!SND.on)return;
    try{
      const now=c.currentTime;
      while(next<now+0.30){
        const step=cfg.mel[idx%cfg.mel.length], m=step[0], len=step[1];
        if(m>0)tone(m,next,spb*len*0.92,cfg.melType,cfg.melVol,SND.bgmGain);
        const b=cfg.bass[bi%cfg.bass.length];
        if(b>0)tone(b,next,spb*0.9,cfg.bassType,cfg.bassVol,SND.bgmGain);
        if(cfg.hat&&bi%2===0)noise(next,0.03,0.03,6000); // 가벼운 하이햇
        next+=spb*len; idx++; bi+=len;
      }
    }catch(e){}
  },60);
}
function bgmStop(){
  if(SND.bgmTimer){clearInterval(SND.bgmTimer);SND.bgmTimer=null;}
  droneStop();
}
/* 장면이 바뀌면 어울리는 트랙으로 교체. delay(ms)를 주면 잠깐 조용했다가 다시 깔립니다. */
function bgmSet(track,delay){
  SND.want=track||null;
  if(SND.switchT){clearTimeout(SND.switchT);SND.switchT=null;}
  if(!track){bgmStop();SND.track=null;return;}
  const go=()=>{
    SND.switchT=null;
    if(SND.want!==track)return;              // 그 사이 장면이 또 바뀌었으면 취소
    if(SND.track===track&&SND.bgmTimer)return; // 이미 같은 곡이 흐르는 중이면 그대로
    bgmStop(); SND.track=track; bgmStart();
  };
  if(delay){ bgmStop(); SND.track=null; SND.switchT=setTimeout(go,delay); }
  else go();
}

/* ---------- 📱 뒤로가기 방지: 게임 중 실수로 나가지 않도록 ---------- */
(function(){
  let warnAt=0;
  try{ history.pushState({dr:1},''); }catch(e){}
  window.addEventListener('popstate',function(){
    if(!INGAME()){ return; }
    try{ history.pushState({dr:1},''); }catch(e){}
    var ovs=document.querySelectorAll('.ovl.on,#vovl.on,#ovl.on,.overlay.on');
    if(ovs.length){ ovs[ovs.length-1].classList.remove('on'); return; } // 열린 창부터 닫기
    const now=Number(new Date());
    if(now-warnAt<2500){ history.back(); return; }
    warnAt=now;
    let t=document.getElementById('backToast');
    if(!t){ t=document.createElement('div'); t.id='backToast';
      t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a2135;border:1px solid #2c3a5c;color:#eef2fb;font-size:13.5px;font-weight:700;padding:12px 18px;border-radius:24px;z-index:10001;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:88%;text-align:center';
      document.body.appendChild(t); }
    t.textContent='게임 중이에요! 정말 나가려면 뒤로가기를 한 번 더 누르세요';
    t.style.display='block';
    setTimeout(function(){ try{t.style.display='none';}catch(e){} },2500);
  });
})();


</script>
</body>
</html>
